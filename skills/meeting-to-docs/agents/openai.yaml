interface:
  display_name: "Meeting to Docs"
  short_description: "Turn meetings into reusable documentation"
  default_prompt: "Use $meeting-to-docs with the recording and supporting materials to create a complete timestamped transcription.md and a focused summary.md without timecodes or side topics, with explanatory diagrams and relevant video frames; finish Russian prose with $humanizer-ru, offer installation if it is missing, and ask about unresolved participants after drafting."
